# --- Seniority filter ---
# Only these levels pass; everything else is rejected.
allowed_levels:
  - intern
  - internship
  - trainee
  - apprentice
  - apprenticeship
  - fresher
  - junior
  - entry level
  - entry-level
  - new grad
  - graduate
  - associate

# Titles containing any of these words are always rejected, regardless of role match.
seniority_block:
  - manager
  - head
  - director
  - lead
  - principal
  - vp
  - vice president
  - chief
  - senior
  - sr
  - exec
  - executive
  - head of
  - staff
  - mid-level
  - mid level
  - experienced
  - controller
  - treasurer

# Non-finance noise titles to reject.
