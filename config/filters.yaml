# Max years of experience allowed in title+description (inclusive).
max_yoe: 2

# --- Location tiers ---
# Tier 1: Mumbai or genuinely fully-remote (no geo restriction).
# Tier 2: Other India, worldwide.
# Tier 3: Everything else -> data/tier3.jsonl, no Discord.

tier1_locations:
  - mumbai

tier2_locations:
  - india
  - bangalore
  - bengaluru
  - hyderabad
  - pune
  - delhi
  - gurgaon
  - gurugram
  - noida
  - chennai
  - kolkata
  - worldwide

# Phrases in location or description that mean "remote but geo-fenced" -> NOT fully remote.
remote_geo_fence:
  - within
  - radius
  - miles of
  - km of
  - must be based in
  - must be located in
  - commutable
  - commuting distance
  - on-site days
  - days in office
  - days in-office
  - hybrid remote

# Regions that disqualify a "remote" job (remote-US, remote-UK, etc.)
remote_region_block:
  - us
  - usa
  - united states
  - uk
  - united kingdom
  - canada
  - emea
  - apac
  - latam
  - europe
