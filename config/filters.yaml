# --- Seniority filter ---
# Only these levels pass; everything else is rejected.
allowed_levels:
  - intern
  - internship
  - trainee
  - apprentice
  - apprenticeship
  - fresher
  - junior
  - entry level
  - entry-level
  - new grad
  - graduate
  - associate

# Titles containing any of these words are always rejected, regardless of role match.
seniority_block:
  - manager
  - head
  - director
  - lead
  - principal
  - vp
  - vice president
  - chief
  - senior
  - sr
  - exec
  - executive
  - head of
  - staff
  - mid-level
  - mid level
  - experienced
  - controller
  - treasurer

# --- Engineering / noise block ---
# Stem-based: "engineer" blocks engineer, engineers, engineering.
# These are matched as TOKEN PREFIXES after title normalization.
# A match is overridden ONLY if the title also contains a phrase from allow_phrases.
engineering_block:
  - engineer
  - developer
  - devops
  - sre
  - software
  - backend
  - frontend
  - fullstack
  - full stack
  - front-end
  - back-end
  - firmware
  - embedded
  - hardware
  - robotics
  - mechanical
  - electrical
  - mechatronic
  - deployment
  - airworthiness
  - aviation engineer
  - machine learning engineer
  - ml engineer
  - mlops
  - data engineer
  - platform
  - infrastructure
  - cloud engineer
  - qa engineer
  - test engineer
  - security engineer
  - football
  - sports agent

# Phrases that override the engineering block.  The WHOLE PHRASE must appear in the
# normalized title.  Single words like "data" or "analyst" do NOT override.
allow_phrases:
  - data analyst
  - business analyst
  - financial analyst
  - finance analyst
  - research analyst
  - credit analyst
  - operations analyst
  - business operations
  - automation specialist
  - automation associate
  - analytics associate
  - bi analyst
  - reporting analyst
  - aviation finance

# Non-engineering noise titles to reject (matched as word-boundary phrases).
noise_block:
  - customer support
  - customer service
  - helpdesk
  - sales representative
  - sales manager
  - sales associate
  - sales executive
  - account executive
  - account manager
  - business development representative
  - business development executive
  - business development manager
  - bdr
  - sdr
  - call center
  - technical support
  - collections
  - tele
  # Design / creative
  - graphic designer
  - ui designer
  - ux designer
  - product designer
  - visual designer
  - motion designer
  - video editor
  - content writer
  - copywriter
  # Marketing / HR / ops
  - marketing
  - social media
  - recruiter
  - recruiting coordinator
  - talent acquisition
  - human resources
  - hr generalist
  - people operations
  - supply chain
  - logistics
  - warehouse
  - procurement
  - legal counsel
  - paralegal
  # Non-finance roles that match generic keywords
  - community operations
  - community manager
  - event coordinator
  - event manager
  - office management
  - office manager
  - pre-sales
  - product support
  - product manager
  - project engineer
  - people analytics
  - customer experience
  - sales operations

# Max years of experience allowed in title+description (inclusive).
max_yoe: 2

# --- Location tiers ---
# Tier 1: Mumbai or genuinely fully-remote (no geo restriction).
# Tier 2: Other India, worldwide.
# Tier 3: Everything else -> data/tier3.jsonl, no Discord.

tier1_locations:
  - mumbai
  - vasai
  - virar
  - thane
  - navi mumbai

