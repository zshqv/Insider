# Phrases in location or description that mean "remote but geo-fenced" -> NOT fully remote.
remote_geo_fence:
  - within
  - radius
  - miles of
  - km of
  - must be based in
  - must be located in
  - commutable
  - commuting distance
  - on-site days
  - days in office
  - days in-office
  - hybrid remote

# Regions that disqualify a "remote" job (remote-US, remote-UK, etc.)
remote_region_block:
  - us
  - usa
  - united states
  - uk
  - united kingdom
  - canada
  - emea
  - apac
  - latam
